<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Query Tickets</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 30px; color: #111827; }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }

        h2 { font-size: 1.25rem; margin-top: 0; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            color: white;
            margin-top: 10px;
        }

        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: #4338ca; }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: #15803d; }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: #b91c1c; }

        #response-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
            display: none;
        }
        
        .success-box { background-color: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .error-box { background-color: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
    </style>
</head>
<body>

    <h1>🎫 Panel de Gestión de Tickets</h1>

    <div class="container">
        <h2>1. Dar de Alta un Ticket</h2>
        <div class="form-group">
            <label for="evento_id">ID Evento</label>
            <input type="number" id="evento_id" value="1">
        </div>
        <div class="form-group">
            <label for="ubicacion_id">ID Ubicación</label>
            <input type="number" id="ubicacion_id" value="1">
        </div>
        <div class="form-group">
            <label for="precio_base">Precio Base ($)</label>
            <input type="number" id="precio_base" value="15000">
        </div>
        <button class="btn-primary" onclick="crearTicket()">Enviar POST (Crear)</button>
    </div>

    <div class="container">
        <h2>2. Acciones sobre Ticket Creado</h2>
        <div class="form-group">
            <label for="ticket_id_action">Ticket ID a Modificar/Vender</label>
            <input type="number" id="ticket_id_action" placeholder="Ej: 1000002">
        </div>
        <div class="form-group">
            <label for="nuevo_precio">Nuevo Precio Base ($) - Solo para Modificar</label>
            <input type="number" id="nuevo_precio" placeholder="Ej: 19500">
        </div>
        <button class="btn-success" onclick="actualizarPrecio()">Enviar PUT (Modificar Precio)</button>
        <button class="btn-danger" onclick="bajaLogicaTicket()">Enviar DELETE (Baja Lógica / Vender)</button>
    </div>

    <div class="container" style="display: none;" id="container-res">
        <h2>Resultado del Servidor</h2>
        <div id="response-box"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/eventos';
        const resContainer = document.getElementById('container-res');
        const resBox = document.getElementById('response-box');

        function mostrarRespuesta(success, data) {
            resContainer.style.display = 'block';
            resBox.style.display = 'block';
            resBox.className = success ? 'success-box' : 'error-box';
            resBox.textContent = JSON.stringify(data, null, 2);
        }

        // 1️⃣ FUNCIÓN PARA EL POST
        async function crearTicket() {
            const evento_id = parseInt(document.getElementById('evento_id').value);
            const ubicacion_id = parseInt(document.getElementById('ubicacion_id').value);
            const precio_base = parseFloat(document.getElementById('precio_base').value);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ evento_id, ubicacion_id, precio_base })
                });
                const result = await response.json();
                
                if (result.success) {
                    // Si se crea bien, le autocompletamos el ID abajo para facilitarte la prueba
                    document.getElementById('ticket_id_action').value = result.data.ticket_id;
                }
                mostrarRespuesta(response.ok, result);
            } catch (error) {
                mostrarRespuesta(false, { error: 'No se pudo conectar con el servidor backend.' });
            }
        }

        // 2️⃣ FUNCIÓN PARA EL PUT
        async function actualizarPrecio() {
            const ticketId = document.getElementById('ticket_id_action').value;
            const nuevoPrecio = parseFloat(document.getElementById('nuevo_precio').value);

            if (!ticketId || !nuevoPrecio) {
                alert('Por favor, completa el Ticket ID y el Nuevo Precio.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${ticketId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ precio_base: nuevoPrecio })
                });
                const result = await response.json();
                mostrarRespuesta(response.ok, result);
            } catch (error) {
                mostrarRespuesta(false, { error: 'Error al conectar con el servidor.' });
            }
        }

        // 3️⃣ FUNCIÓN PARA EL DELETE
        async function bajaLogicaTicket() {
            const ticketId = document.getElementById('ticket_id_action').value;

            if (!ticketId) {
                alert('Por favor, ingresa un Ticket ID.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${ticketId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                mostrarRespuesta(response.ok, result);
            } catch (error) {
                mostrarRespuesta(false, { error: 'Error al conectar con el servidor.' });
            }
        }
    </script>
</body>
</html>
